<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a01878">
<!-- Content security policy. Scripts only from this site, network only to fonts and this site's /api/agent.
     build.js swaps the script rule for hashes of the inlined scripts. frame-ancestors is sent as a real header (vercel.json). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Petal</title>
<link rel="icon" href="public/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="design/petal.css">
<style>
/* App layer on top of the mockup stylesheet: real viewport instead of a fixed 390px frame. */
html, body { background: var(--surface-100); }
.ph { width: 100%; max-width: 430px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; overflow: visible; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
.ph.has-tabs { padding-bottom: calc(112px + env(safe-area-inset-bottom)); }
.tabs { position: fixed; left: 50%; right: auto; transform: translateX(-50%); width: calc(min(430px, 100vw) - 32px); bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 10; }
.fab { position: fixed; right: max(16px, calc(50vw - 199px)); bottom: calc(100px + env(safe-area-inset-bottom)); z-index: 9; }
.scrim { position: fixed; z-index: 20; }
.sheet { position: fixed; left: 50%; right: auto; transform: translateX(-50%); width: min(430px, 100vw); max-height: 90dvh; overflow-y: auto; z-index: 21; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
.hero { position: relative; }
.radial-anchor { position: absolute; right: 20px; top: 20px; width: 44px; height: 44px; z-index: 22; }
.radial { z-index: 22; }
.app-toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(104px + env(safe-area-inset-bottom)); z-index: 30; box-shadow: var(--shadow-card); white-space: nowrap; }
.avatar { width: 44px; height: 44px; border-radius: 96px 0 96px 0; background: var(--surface-300); border: 2px solid var(--border-strong); font: 800 18px/1 var(--font-sans); color: var(--plum); }
.chip-menstrual { background: var(--period); }
.chip-follicular { background: var(--follicular); }
.chip-ovulation { background: var(--ovulation); }
button.pt-day { cursor: pointer; }
.pt-day:disabled, .mon button:disabled { opacity: .35; cursor: default; }
select.inp { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-muted) 50%), linear-gradient(135deg, var(--ink-muted) 50%, transparent 50%); background-position: calc(100% - 22px) 50%, calc(100% - 16px) 50%; background-size: 6px 6px; background-repeat: no-repeat; }
.inp[aria-invalid="true"] { border-color: var(--period-ink); }
.linkbtn { background: none; border: 0; padding: 0 4px; min-height: 44px; color: var(--plum); font: 600 13px/18px var(--font-sans); cursor: pointer; }
.chk-btn { width: 44px; height: 44px; margin: -8px; flex: none; display: flex; align-items: center; justify-content: center; background: none; border: 0; padding: 0; cursor: pointer; border-radius: 9999px; }
button.wrow { width: 100%; text-align: left; cursor: pointer; color: inherit; font: inherit; }
button.cell2 { cursor: pointer; }
.field-label { font: 600 13px/18px var(--font-sans); color: var(--ink); }
.task .tx b { overflow-wrap: anywhere; }
.warn b.ifb { font: 700 13px/18px var(--font-sans); color: var(--plum); }
button.wtype { color: inherit; font: inherit; }
.ex-btn { width: 100%; text-align: left; cursor: pointer; color: inherit; font: inherit; border-width: 2px; }
.ex-btn.on { border-color: var(--plum); background: var(--surface-300); }
.ex .tx b, .wtype .tx b { color: var(--ink); }
.menu-pop { position: fixed; top: 76px; right: max(16px, calc(50vw - 199px)); width: 236px; padding: 4px 8px; border-radius: 24px; z-index: 21; box-shadow: var(--shadow-float); }
.lrow.menu-item, .lrow.set-row { width: 100%; border: 0; border-bottom: 1px solid var(--border); background: transparent; text-align: left; cursor: pointer; color: inherit; font: inherit; }
.lrow.menu-item { min-height: 52px; }
.lrow.set-row { min-height: 56px; }
.lrow.menu-item:last-child, .lrow.set-row:last-child { border-bottom: 0; }
.lrow.set-row:disabled { cursor: default; }
.dialog { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: calc(min(430px, 100vw) - 48px); z-index: 21; border-radius: 32px; padding: 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow-float); }
.dlg-ic { width: 48px; height: 48px; border-radius: 9999px; background: var(--surface-300); color: var(--plum); display: flex; align-items: center; justify-content: center; }
.dlg-ic svg, .round-ic svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.round-ic { width: 40px; height: 40px; border-radius: 9999px; background: var(--surface-300); color: var(--plum); display: flex; align-items: center; justify-content: center; flex: none; }
.pt-btn-primary.danger { background: var(--period-ink); }
.mode-tile { flex: 1; display: flex; flex-direction: column; gap: 8px; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: inherit; }
.chat-page { padding-bottom: calc(240px + env(safe-area-inset-bottom)); }
.chat-dock { position: fixed; left: 50%; transform: translateX(-50%); width: calc(min(430px, 100vw) - 32px); bottom: calc(100px + env(safe-area-inset-bottom)); z-index: 9; display: flex; flex-direction: column; gap: 8px; }
.chat-page.no-tabs { padding-bottom: calc(120px + env(safe-area-inset-bottom)); }
.chat-dock.no-tabs { bottom: calc(16px + env(safe-area-inset-bottom)); }
.chat-dock .pt-compose { background: var(--surface-100); box-shadow: var(--shadow-card); }
.chat-inp { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; padding: 0 12px; font: 400 15px/22px var(--font-sans); color: var(--ink); outline: none; }
.chat-inp::placeholder { color: var(--ink-muted); }
.pt-compose:focus-within { border-color: var(--plum); }
.pt-send { cursor: pointer; flex: none; }
.pt-send rect { fill: currentColor; stroke: none; }
.pt-msg code, .t-sub code { font: 600 13px/18px ui-monospace, monospace; background: var(--surface-200); padding: 2px 6px; border-radius: 8px; }
.splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: var(--surface-100); transition: opacity 300ms ease-out; }
.splash b { font: 800 32px/40px var(--font-sans); color: var(--plum); }
.splash.out { opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: no-preference) { .splash svg { animation: splash-in 600ms ease-out; } }
@media (prefers-reduced-motion: reduce) { .splash { transition: none; } }
@keyframes splash-in { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.qcircles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.qcircle { display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: 0; padding: 0; cursor: pointer; font: 600 13px/18px var(--font-sans); color: var(--plum); }
.qcircle .dot { width: 64px; height: 64px; border-radius: 9999px; background: var(--surface-300); display: flex; align-items: center; justify-content: center; position: relative; transition: transform 120ms ease-out; }
.qcircle .dot svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.qcircle .dot::after { content: '+'; position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px; border-radius: 9999px; background: var(--action); color: var(--on-action); font: 700 16px/22px var(--font-sans); text-align: center; border: 2px solid var(--surface-100); }
.qcircle:hover .dot, .qcircle:focus-visible .dot { transform: scale(1.05); }
.qcircle:focus-visible { outline: none; }
.qcircle:focus-visible .dot { box-shadow: 0 0 0 3px var(--plum); }
.tip-bubble { position: fixed; left: 50%; transform: translateX(-50%); width: calc(min(430px, 100vw) - 32px); max-width: none; bottom: calc(100px + env(safe-area-inset-bottom)); z-index: 12; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow-float); border-radius: 24px; border-bottom-left-radius: 8px; }
@media (prefers-reduced-motion: no-preference) { .tip-bubble { animation: tip-in 240ms ease-out; } }
@keyframes tip-in { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
/* The calorie card is last on the dashboard: extra room below it lets the meal menu open fully above the tab bar. */
.ph.has-tabs.radial-open { padding-bottom: calc(340px + env(safe-area-inset-bottom)); }
/* Dashboard month calendar */
.mcal { margin-top: 12px; display: flex; flex-direction: column; gap: 2px; }
.mcal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.mcal-head .ico { width: 40px; height: 40px; }
.mcal-head .ico svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mcal-title { border: 0; border-radius: 9999px; padding: 6px 14px; background: var(--surface-300); color: var(--ink); font: 700 16px/22px var(--font-sans); cursor: pointer; }
.mcal-title:disabled { cursor: default; background: transparent; }
.mrow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding: 3px 4px; border-radius: 9999px; }
.mrow.now { background: var(--surface-200); }
.mrow.dow span { text-align: center; font: 600 12px/20px var(--font-sans); color: var(--ink-muted); }
.mday { position: relative; width: 100%; max-width: 40px; aspect-ratio: 1; justify-self: center; border: 0; border-radius: 9999px; background: transparent; color: var(--ink); font: 600 14px/1 var(--font-sans); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
.mday.period { background: var(--period); }
.mday.follicular { background: var(--follicular); }
.mday.fertile { background: var(--ovulation); }
.mday.luteal { background: var(--luteal); }
.mday.out { opacity: .38; }
/* Today keeps its phase colour; a plum ring, with a thin gap, marks it. */
.mday.today { font-weight: 800; opacity: 1; box-shadow: 0 0 0 2px var(--surface-200), 0 0 0 4.5px var(--action); }
.mday:focus-visible { outline: 3px solid var(--plum); outline-offset: 2px; }
.mday .task-dot { position: absolute; bottom: 3px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 9999px; background: var(--plum); }
/* Day timeline */
.day-page { padding-bottom: calc(120px + env(safe-area-inset-bottom)); }
.day-head { display: flex; align-items: center; gap: 8px; }
.day-title { flex: 1; margin: 0; font: 800 30px/36px var(--font-sans); color: var(--ink); }
.day-title span { color: var(--action); }
.wstrip { display: flex; align-items: center; gap: 2px; margin-top: 16px; }
.wstrip .wnav { width: 32px; height: 32px; flex: none; background: none; }
.wstrip .wnav svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wdays { flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.wday { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: none; padding: 4px 0; cursor: pointer; color: var(--ink); font: inherit; }
.wday .dn { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); }
.wday .dd { width: 36px; height: 36px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; font: 700 17px/1 var(--font-sans); }
.wday.today .dd { color: var(--action); }
.wday.on .dd { background: var(--action); color: var(--on-action); }
.dscore { position: relative; width: 38px; height: 16px; border-radius: 9999px; overflow: hidden; background: var(--surface-200); border: 1px solid var(--border); }
.dscore.empty { visibility: hidden; }
.dscore i { position: absolute; left: 0; top: 0; bottom: 0; }
.dscore b { position: relative; display: block; text-align: center; font: 700 10px/14px var(--font-sans); color: var(--ink); }
.dscore.good i { background: var(--follicular); } .dscore.mid i { background: var(--ovulation); } .dscore.low i { background: var(--period); }
.day-sheet { margin: 16px -16px 0; padding: 20px 16px 24px; background: var(--surface-200); border-radius: 32px 32px 0 0; min-height: 60vh; box-shadow: var(--shadow-card); }
.adays { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.aday { flex: none; width: 76px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 0; font: inherit; color: var(--ink); text-align: center; }
button.aday { cursor: pointer; }
.aday .dot { width: 60px; height: 60px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; color: var(--ink-on-fill); }
.aday .dot svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.aday .lab { font: 600 12px/16px var(--font-sans); }
.timeline { position: relative; margin-top: 16px; display: flex; flex-direction: column; gap: 18px; }
.timeline::before { content: ''; position: absolute; left: 95px; top: 8px; bottom: 8px; width: 2px; background: var(--border-strong); opacity: .6; }
.tl-row { position: relative; display: grid; grid-template-columns: 52px 72px minmax(0, 1fr) 44px; align-items: center; gap: 0 8px; }
.tl-time { font: 500 13px/18px var(--font-sans); color: var(--ink-muted); align-self: start; padding-top: 6px; }
.tl-pill { justify-self: center; width: 52px; border-radius: 9999px; background: var(--c); display: flex; align-items: center; justify-content: center; color: var(--ink-on-fill); position: relative; z-index: 1; }
.tl-pill svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.tl-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tl-when { font: 500 13px/18px var(--font-sans); color: var(--ink-muted); }
.tl-body b { font: 700 17px/22px var(--font-sans); color: var(--ink); overflow-wrap: anywhere; }
.tl-row.done .tl-body b { text-decoration: line-through; color: var(--ink-muted); }
.tl-row.done .tl-pill, .tl-row.missed .tl-pill { background: color-mix(in srgb, var(--c) 40%, var(--surface-200)); }
.tl-row.missed .tl-when { color: var(--period-ink); }
.tl-check { width: 32px; height: 32px; border-radius: 9999px; border: 2.5px solid var(--c); background: transparent; color: var(--ink-on-fill); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; justify-self: center; }
.tl-check.on { background: var(--c); }
.tl-check svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.tl-row.missed .tl-check { border-color: var(--period-ink); color: var(--period-ink); }
.tl-now { position: relative; display: grid; grid-template-columns: 52px minmax(0, 1fr); align-items: center; gap: 8px; z-index: 2; }
.tl-now .tl-time { color: var(--action); font-weight: 800; padding-top: 0; }
.tl-now-line { height: 2px; background: var(--action); border-radius: 2px; position: relative; }
.tl-now-line::before { content: ''; position: absolute; left: 30px; top: -5px; width: 12px; height: 12px; border-radius: 9999px; background: var(--action); }
.tl-empty { margin-top: 20px; display: flex; flex-direction: column; gap: 4px; }
.tl-hint { margin-top: 20px; display: flex; gap: 8px; align-items: flex-start; font: 500 13px/18px var(--font-sans); color: var(--ink); }
.tl-hint svg { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--plum); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.fab.solo { bottom: calc(24px + env(safe-area-inset-bottom)); }
.fab.solo svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.25; stroke-linecap: round; }
.cam-btn { width: 40px; height: 40px; flex: none; border: 0; border-radius: 9999px; background: var(--surface-300); color: var(--plum); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
.cam-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.cam-btn:disabled { opacity: .5; cursor: default; }
.msg-photo { display: block; max-width: 220px; max-height: 260px; width: auto; border-radius: 12px; object-fit: cover; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: sheet-up 240ms ease-out; }
  .radial { animation: fade-in 200ms ease-out; }
}
@media (prefers-reduced-motion: reduce) {
  .sheet, .radial { animation: fade-in 200ms linear; }
}
@keyframes sheet-up { from { transform: translate(-50%, 24px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<!-- Logo screen on every open. Static so it shows before any script runs; app.js removes it after 1 second. -->
<div class="splash" id="splash" role="status" aria-label="Opening Petal"><svg viewBox="0 0 100 100" width="96" height="96" aria-hidden="true"><rect width="100" height="100" rx="28" fill="#a01878"/><g transform="translate(50 50)"><path transform="rotate(270) translate(3 3)" d="M0 0A21 21 0 0 1 26 26A21 21 0 0 1 0 0Z" fill="#f26b6b"/><path transform="rotate(0) translate(3 3)" d="M0 0A21 21 0 0 1 26 26A21 21 0 0 1 0 0Z" fill="#8fd694"/><path transform="rotate(90) translate(3 3)" d="M0 0A21 21 0 0 1 26 26A21 21 0 0 1 0 0Z" fill="#ffd24a"/><path transform="rotate(180) translate(3 3)" d="M0 0A21 21 0 0 1 26 26A21 21 0 0 1 0 0Z" fill="#8ec5f0"/><circle r="4" fill="#ffffff"/></g></svg><b>Petal</b></div>
<main id="app"></main>
<!-- Photo picker for Petal Lens. Outside #app so re-renders keep it. accept image/* lets phones offer the camera or the gallery. -->
<input type="file" id="photo-in" accept="image/*" class="sr-only" tabindex="-1" aria-hidden="true">
<noscript><p style="padding: 24px">Petal needs JavaScript to run.</p></noscript>
<script src="src/petal-engine.js"></script>
<script src="src/exercise-catalog.js"></script>
<script src="src/assistant.js"></script>
<script src="src/app.js"></script>
</body>
</html>
