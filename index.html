<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a01878">
<!-- Content security policy. Scripts only from this site, network only to fonts, this site's /api/chat and a model on this device.
     build.js swaps the script rule for hashes of the inlined scripts. frame-ancestors needs a real header when hosted. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:* https://127.0.0.1:* https://localhost:*; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Petal</title>
<link rel="icon" href="public/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="design/petal.css">
<style>
/* App layer on top of the mockup stylesheet: real viewport instead of a fixed 390px frame. */
html, body { background: var(--surface-100); }
.ph { width: 100%; max-width: 430px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; overflow: visible; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
.ph.has-tabs { padding-bottom: calc(112px + env(safe-area-inset-bottom)); }
.tabs { position: fixed; left: 50%; right: auto; transform: translateX(-50%); width: calc(min(430px, 100vw) - 32px); bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 10; }
.fab { position: fixed; right: max(16px, calc(50vw - 199px)); bottom: calc(100px + env(safe-area-inset-bottom)); z-index: 9; }
.scrim { position: fixed; z-index: 20; }
.sheet { position: fixed; left: 50%; right: auto; transform: translateX(-50%); width: min(430px, 100vw); max-height: 90dvh; overflow-y: auto; z-index: 21; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
.hero { position: relative; }
.radial-anchor { position: absolute; right: 20px; top: 20px; width: 44px; height: 44px; z-index: 22; }
.radial { z-index: 22; }
.app-toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(104px + env(safe-area-inset-bottom)); z-index: 30; box-shadow: var(--shadow-card); white-space: nowrap; }
.avatar { width: 44px; height: 44px; border-radius: 96px 0 96px 0; background: var(--surface-300); border: 2px solid var(--border-strong); font: 800 18px/1 var(--font-sans); color: var(--plum); }
.chip-menstrual { background: var(--period); }
.chip-follicular { background: var(--follicular); }
.chip-ovulation { background: var(--ovulation); }
button.pt-day { cursor: pointer; }
.pt-day:disabled, .mon button:disabled { opacity: .35; cursor: default; }
select.inp { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-muted) 50%), linear-gradient(135deg, var(--ink-muted) 50%, transparent 50%); background-position: calc(100% - 22px) 50%, calc(100% - 16px) 50%; background-size: 6px 6px; background-repeat: no-repeat; }
.inp[aria-invalid="true"] { border-color: var(--period-ink); }
.linkbtn { background: none; border: 0; padding: 0 4px; min-height: 44px; color: var(--plum); font: 600 13px/18px var(--font-sans); cursor: pointer; }
.chk-btn { width: 44px; height: 44px; margin: -8px; flex: none; display: flex; align-items: center; justify-content: center; background: none; border: 0; padding: 0; cursor: pointer; border-radius: 9999px; }
button.wrow { width: 100%; text-align: left; cursor: pointer; color: inherit; font: inherit; }
button.cell2 { cursor: pointer; }
.field-label { font: 600 13px/18px var(--font-sans); color: var(--ink); }
.task .tx b { overflow-wrap: anywhere; }
.warn b.ifb { font: 700 13px/18px var(--font-sans); color: var(--plum); }
button.wtype { color: inherit; font: inherit; }
.ex-btn { width: 100%; text-align: left; cursor: pointer; color: inherit; font: inherit; border-width: 2px; }
.ex-btn.on { border-color: var(--plum); background: var(--surface-300); }
.ex .tx b, .wtype .tx b { color: var(--ink); }
.menu-pop { position: fixed; top: 76px; right: max(16px, calc(50vw - 199px)); width: 236px; padding: 4px 8px; border-radius: 24px; z-index: 21; box-shadow: var(--shadow-float); }
.lrow.menu-item, .lrow.set-row { width: 100%; border: 0; border-bottom: 1px solid var(--border); background: transparent; text-align: left; cursor: pointer; color: inherit; font: inherit; }
.lrow.menu-item { min-height: 52px; }
.lrow.set-row { min-height: 56px; }
.lrow.menu-item:last-child, .lrow.set-row:last-child { border-bottom: 0; }
.lrow.set-row:disabled { cursor: default; }
.dialog { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: calc(min(430px, 100vw) - 48px); z-index: 21; border-radius: 32px; padding: 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow-float); }
.dlg-ic { width: 48px; height: 48px; border-radius: 9999px; background: var(--surface-300); color: var(--plum); display: flex; align-items: center; justify-content: center; }
.dlg-ic svg, .round-ic svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.round-ic { width: 40px; height: 40px; border-radius: 9999px; background: var(--surface-300); color: var(--plum); display: flex; align-items: center; justify-content: center; flex: none; }
.pt-btn-primary.danger { background: var(--period-ink); }
.mode-tile { flex: 1; display: flex; flex-direction: column; gap: 8px; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: inherit; }
.chat-page { padding-bottom: calc(240px + env(safe-area-inset-bottom)); }
.chat-dock { position: fixed; left: 50%; transform: translateX(-50%); width: calc(min(430px, 100vw) - 32px); bottom: calc(100px + env(safe-area-inset-bottom)); z-index: 9; display: flex; flex-direction: column; gap: 8px; }
.chat-dock .pt-compose { background: var(--surface-100); box-shadow: var(--shadow-card); }
.chat-inp { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; padding: 0 12px; font: 400 15px/22px var(--font-sans); color: var(--ink); outline: none; }
.chat-inp::placeholder { color: var(--ink-muted); }
.pt-compose:focus-within { border-color: var(--plum); }
.pt-send { cursor: pointer; flex: none; }
.pt-send rect { fill: currentColor; stroke: none; }
.pt-msg code, .t-sub code { font: 600 13px/18px ui-monospace, monospace; background: var(--surface-200); padding: 2px 6px; border-radius: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: sheet-up 240ms ease-out; }
  .radial { animation: fade-in 200ms ease-out; }
}
@media (prefers-reduced-motion: reduce) {
  .sheet, .radial { animation: fade-in 200ms linear; }
}
@keyframes sheet-up { from { transform: translate(-50%, 24px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<main id="app"></main>
<noscript><p style="padding: 24px">Petal needs JavaScript to run.</p></noscript>
<script src="src/petal-engine.js"></script>
<script src="src/exercise-catalog.js"></script>
<script src="src/assistant.js"></script>
<script src="src/app.js"></script>
</body>
</html>
